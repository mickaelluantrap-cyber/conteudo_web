<!DOCTYPE html>
<html>

<head>
    <title>Operações matemáticas</title>
    <link rel="stylesheet" href="styles.css">
    <meta lang="pt-br">
    <meta charset="utf-8">
</head>

<body>
    <div class="form-intero">
        <div class="campos">
            <input type="number" id="input-esquerdo">
            <select id="operacao">
                <option value="soma">+</option>
                <option value="subtração">-</option>
                <option value="mutiplicação">x</option>
                <option value="divisão">/</option>
            </select>
            <input type="number" id="input-direito">
        </div>
        <div class="butao">
            <button>Caucular</button>
        </div>

    </div>
    <div class="resultados">
        <p>Resultado: <span id="Resultado">0</span></p>
        <p>Maior número <span id="maior">0</span></p>
        <p>Menor número <span id="menor">0</span></p>
    </div>
</body>

</html>
